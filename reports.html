<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPSC Tracker - Reports</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Reports specific styles */
        .reports-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .report-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 12px 24px;
            border: none;
            background: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: #007bff;
            color: white;
        }
        .chart-container {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            margin-bottom: 24px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 8px;
        }
        @media (max-width: 768px) {
            .report-tabs {
                justify-content: center;
            }
            .tab-btn {
                padding: 10px 16px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-chart-line"></i> UPSC Tracker Reports</h1>
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Tracker</a>
        </header>

        <div class="reports-container">
            <!-- Stats Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="totalDays">0</div>
                    <div>Total Study Days</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalHours">0</div>
                    <div>Total Study Hours</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="avgDaily">0</div>
                    <div>Avg Daily Hours</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="streak">0</div>
                    <div>Current Streak</div>
                </div>
            </div>

            <!-- Report Tabs -->
            <div class="report-tabs">
                <button class="tab-btn active" data-tab="daily">Daily</button>
                <button class="tab-btn" data-tab="weekly">Weekly</button>
                <button class="tab-btn" data-tab="monthly">Monthly</button>
                <button class="tab-btn" data-tab="yearly">Yearly</button>
            </div>

            <!-- Charts -->
            <div id="daily-chart" class="chart-container active">
                <h3>Daily Study Progress</h3>
                <canvas id="dailyChart"></canvas>
            </div>
            <div id="weekly-chart" class="chart-container">
                <h3>Weekly Study Progress</h3>
                <canvas id="weeklyChart"></canvas>
            </div>
            <div id="monthly-chart" class="chart-container">
                <h3>Monthly Study Progress</h3>
                <canvas id="monthlyChart"></canvas>
            </div>
            <div id="yearly-chart" class="chart-container">
                <h3>Yearly Study Progress</h3>
                <canvas id="yearlyChart"></canvas>
            </div>
        </div>
    </div>

    <script type="module" src="db.js"></script> 
    <script src="reports.js"></script>
</body>
</html>
