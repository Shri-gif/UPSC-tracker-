<!DOCTYPE html>
<html>
<head>
    <title>Update Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="update-password-form">
            <h2>Naya Password Set Karein</h2>
            <form id="updatePasswordForm">
                <div class="form-group">
                    <label for="newPassword">Naya Password:</label>
                    <input type="password" id="newPassword" name="newPassword" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Password Confirm Karein:</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6">
                </div>
                <button type="submit" id="updatePasswordBtn">Password Update Karein</button>
            </form>
            <div id="updateMessage" class="message"></div>
            <div class="back-link">
                <a href="login.html">← Login page pe jao</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="db.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('updatePasswordForm');
            const newPassword = document.getElementById('newPassword');
            const confirmPassword = document.getElementById('confirmPassword');
            const updatePasswordBtn = document.getElementById('updatePasswordBtn');
            const updateMessage = document.getElementById('updateMessage');

            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                const password = newPassword.value;
                const confirm = confirmPassword.value;

                if (password !== confirm) {
                    showMessage('Passwords match nahi kar rahe!', 'error');
                    return;
                }

                if (password.length < 6) {
                    showMessage('Password minimum 6 characters ka hona chahiye!', 'error');
                    return;
                }

                updatePasswordBtn.disabled = true;
                updatePasswordBtn.textContent = 'Update kar raha hun...';

                try {
                    const { error } = await supabase.auth.updateUser({
                        password: password
                    });

                    if (error) {
                        showMessage(error.message, 'error');
                    } else {
                        showMessage('Password successfully update ho gaya! Ab login karein.', 'success');
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 2000);
                    }
                } catch (err) {
                    showMessage('Kuch galat ho gaya!', 'error');
                } finally {
                    updatePasswordBtn.disabled = false;
                    updatePasswordBtn.textContent = 'Password Update Karein';
                }
            });

            function showMessage(message, type) {
                updateMessage.textContent = message;
                updateMessage.className = `message ${type}`;
            }
        });
    </script>
</body>
</html>
