<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - UPSC Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="reports.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="../index.html" class="nav-logo">
                <h2>📚 UPSC Tracker</h2>
            </a>
            <div class="nav-menu">
                <a href="../index.html">Dashboard</a>
                <a href="../pages/add-study.html">Add Study</a>
                <a href="reports.html" class="active">Reports</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📊 Study Reports</h1>
            <div class="period-tabs">
                <button class="tab active" data-period="daily">24h</button>
                <button class="tab" data-period="weekly">7d</button>
                <button class="tab" data-period="monthly">30d</button>
                <button class="tab" data-period="yearly">1y</button>
            </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="loading">🔄 Loading data...</div>

        <!-- Stats -->
        <div id="stats" class="stats-grid" style="display:none;">
            <div class="stat-card">
                <h3>Total Hours</h3>
                <div id="total-hours" class="stat-value">0h</div>
            </div>
            <div class="stat-card">
                <h3>Avg Daily</h3>
                <div id="avg-hours" class="stat-value">0h</div>
            </div>
            <div class="stat-card">
                <h3>Best Subject</h3>
                <div id="best-subject" class="stat-value">-</div>
            </div>
            <div class="stat-card">
                <h3>Consistency</h3>
                <div id="consistency" class="stat-value">0%</div>
            </div>
        </div>

        <!-- Charts -->
        <div id="charts" class="charts" style="display:none;">
            <div class="chart-container">
                <h3>📈 Study Trend</h3>
                <canvas id="trend-chart"></canvas>
            </div>
            <div class="chart-container">
                <h3>📊 Subject Distribution</h3>
                <canvas id="subject-chart"></canvas>
            </div>
        </div>
    </div>

    <script type="module" src="reports.js"></script>
</body>
</html>
