<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPSC Tracker - Reports</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="reports.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="nav-container">
                <a href="../index.html" class="nav-logo">
                    <h2>UPSC Tracker</h2>
                </a>
                <ul class="nav-menu">
                    <li><a href="../index.html">Dashboard</a></li>
                    <li><a href="../pages/add-study.html">Add Study</a></li>
                    <li><a href="reports.html" class="active">Reports</a></li>
                </ul>
            </div>
        </nav>

        <div class="reports-container">
            <h1>📊 Study Reports</h1>
            
            <!-- Time Period Selector -->
            <div class="period-selector">
                <button class="period-btn active" data-period="daily">Daily</button>
                <button class="period-btn" data-period="weekly">Weekly</button>
                <button class="period-btn" data-period="monthly">Monthly</button>
                <button class="period-btn" data-period="yearly">Yearly</button>
            </div>

            <!-- Stats Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Hours</h3>
                    <div class="stat-value" id="totalHours">0</div>
                </div>
                <div class="stat-card">
                    <h3>Avg Daily</h3>
                    <div class="stat-value" id="avgDaily">0</div>
                </div>
                <div class="stat-card">
                    <h3>Best Subject</h3>
                    <div class="stat-value" id="bestSubject">-</div>
                </div>
                <div class="stat-card">
                    <h3>Consistency</h3>
                    <div class="stat-value" id="consistency">0%</div>
                </div>
            </div>

            <!-- Charts -->
            <div class="charts-container">
                <div class="chart-card">
                    <h3>📈 Study Hours Trend</h3>
                    <canvas id="trendChart"></canvas>
                </div>
                <div class="chart-card">
                    <h3>📊 Subject Wise Distribution</h3>
                    <canvas id="subjectChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="reports.js"></script>
</body>
                      </html>
