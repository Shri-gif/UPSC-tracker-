<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPSC Tracker - Supabase</title>
    
     <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            max-width: 900px; 
            margin: 0 auto; 
            padding: 20px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        .auth-container { display: flex; gap: 30px; margin-bottom: 30px; }
        .auth-form { flex: 1; background: #f8f9fa; padding: 25px; border-radius: 15px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input { width: 100%; padding: 12px; border: 2px solid #e1e5e9; border-radius: 10px; font-size: 16px; transition: border-color 0.3s; }
        input:focus { outline: none; border-color: #667eea; }
        button { 
            width: 100%; padding: 14px; background: linear-gradient(45deg, #667eea, #764ba2); 
            color: white; border: none; border-radius: 10px; font-size: 16px; 
            font-weight: 600; cursor: pointer; transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); }
        .dashboard-header { 
            display: flex; justify-content: space-between; align-items: center; 
            background: linear-gradient(45deg, #667eea, #764ba2); 
            color: white; padding: 20px; border-radius: 15px; margin-bottom: 30px;
        }
        .study-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .entries-list { display: grid; gap: 20px; }
        .entry-card { 
            background: #f8f9fa; border-radius: 15px; padding: 25px; 
            border-left: 5px solid #667eea; box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        .entry-date { font-size: 24px; font-weight: bold; color: #333; margin-bottom: 15px; }
        .entry-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .stat { background: white; padding: 12px; border-radius: 10px; text-align: center; font-weight: 600; }
        .entry-actions { display: flex; gap: 10px; }
        .btn-small { padding: 8px 16px; font-size: 14px; border-radius: 8px; cursor: pointer; border: none; }
        .edit-btn { background: #28a745; color: white; }
        .delete-btn { background: #dc3545; color: white; }
        .hidden { display: none !important; }
        .no-entries { text-align: center; color: #666; font-style: italic; padding: 40px; }
        @media (max-width: 768px) { .auth-container { flex-direction: column; } }
         .chart-box {
  width: 100%;
  max-width: 500px;
  margin: 20px auto;
  background: white;
  padding: 15px;
  border-radius: 15px;
  height: 300px;        
  overflow-x: auto;
         }

         canvas {
  width: 100% !important;
  height: 250px !important;
  min-width: 600px;

         }
    </style>  
    
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="#" onclick="showDashboard()">Dashboard</a>
            <a href="#" onclick="showReports()">Reports</a>
            <a href="index.html" class="nav-logo">             
                <h2>📚 UPSC Tracker</h2>
            </a>
        </div>
    </nav>
    
    <div class="container">
        <!-- AUTH SECTION -->
        <div id="authSection">
            <h1>🔐 UPSC Tracker Login</h1>
            <p style="margin: 5px 0 20px; font-size: 13px; opacity: 0.7; letter-spacing: 1px; text-align:center;">
             by Srivi 🚀
            </p> 
            <div class="auth-container">
                <div class="auth-form">
                    <h3>📧 Login</h3>
                    <form id="loginForm">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="loginEmail" placeholder="your@email.com" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="loginPassword" placeholder="Password" required>
                        </div>
                        <button type="submit">🚀 Login</button>
                    </form> 
                </div>
                <div class="auth-form">
                    <h3>✨ Sign Up</h3>
                    <form id="signupForm">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="signupEmail" placeholder="your@email.com" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="signupPassword" placeholder="6+ characters" required>
                        </div>
                        <button type="submit">📝 Create Account</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- DASHBOARD SECTION -->
        <div class="dashboard-header">
            <div>
        <a href="index.html">Home</a>
        <h1 style="margin:0;">📚 UPSC Study Tracker</h1>
        <p style="margin: 2px 0 0; font-size: 13px; opacity: 0.8;">
            by Srivi 🚀
        </p>
            </div>
            <div>
        <span id="userEmail" style="margin-right: 15px; font-weight: 600;"></span>     
        <button class="btn-small" onclick="logout()">🚪 Logout</button>
    </div>

        </div>
        <h3 style="margin-top:20px;">📊 Analytics</h3>

<div class="chart-box">
    <canvas id="trendChart"></canvas>
</div>
              <form id="addForm" class="study-form">
                <div class="form-group">
                    <label>📅 Date</label>
                    <input type="date" id="entryDate" required>
                </div>
                <div class="form-group">
                    <label>📖 GS Hours</label>
                    <input type="number" id="gsHours" step="0.5" min="0" placeholder="0">
                </div>
                <div class="form-group">
                    <label>🎯 CSAT Hours</label>
                    <input type="number" id="csatHours" step="0.5" min="0" placeholder="0">
                </div>
                <div class="form-group">
                    <label>📚 Optional</label>
                    <input type="number" id="optionalHours" step="0.5" min="0" placeholder="0">
                </div>
                <div class="form-group">
                    <label>📰 Current Affairs</label>
                    <input type="number" id="currentAffairs" step="0.5" min="0" placeholder="0">
                </div>
                <div class="form-group">
                    <label>🔄 Revision</label>
                    <input type="number" id="revisionHours" step="0.5" min="0" placeholder="0">
                </div>
                <div class="form-group">
                    <label>📝 Mock Test</label>
                    <input type="number" id="mockHours" step="0.5" min="0" placeholder="0">
                </div>
                <button type="submit">➕ Add Study Session</button>
                <button type="button" class="btn-small" onclick="resetForm()" style="width: auto; background: #6c757d;">🔄 Reset</button>
         </form>
            <div id="dataList" class="entries-list">
                <div class="no-entries">Login to see your study sessions! 🎯</div>
            </div>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 🔥 CRITICAL: These script tags MUST be present -->
    <script type="module" src="db.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
