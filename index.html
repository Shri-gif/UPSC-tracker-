<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPSC Tracker</title>
    
    <!-- 🔥 CRITICAL: Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 🔥 CRITICAL: Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="loading-spinner" style="display: none;">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">📚 UPSC Tracker</div>
            <div class="nav-buttons">
                <span id="userEmail" style="display: none;"></span>
                <button id="loginBtn" class="btn btn-primary">🔐 Login</button>
                <button id="logoutBtn" class="btn btn-secondary" style="display: none;">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Dashboard (Hidden initially) -->
        <div id="dashboard" style="display: none;">
            <div class="dashboard-header">
                <h2>🎯 Welcome Back!</h2>
                <p>Track your UPSC preparation</p>
            </div>
            <button id="addEntryBtn" class="btn btn-success">➕ Add Study Entry</button>
            
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <h3 id="totalDays">0</h3>
                    <p>Study Days</p>
                </div>
                <div class="stat-card">
                    <h3 id="avgStudyHours">0</h3>
                    <p>Avg Hours/Day</p>
                </div>
            </div>
            
            <!-- Entries -->
            <div class="recent-entries">
                <h3>📊 Recent Entries</h3>
                <div id="entriesList" class="entries-grid"></div>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>🔐 Login / Signup</h2>
            <form id="authForm">
                <div class="form-group">
                    <label>📧 Email</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label>🔒 Password</label>
                    <input type="password" id="password" placeholder="Min 6 chars" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary full-width">🚀 Continue</button>
            </form>
        </div>
    </div>

    <!-- Entry Modal -->
    <div id="entryModal" class="modal">
        <div class="modal-content large-modal">
            <span class="close">&times;</span>
            <h2>➕ Add Study Entry</h2>
            <form id="entryForm">
                <div class="form-group">
                    <label>📅 Date</label>
                    <input type="date" id="entryDate" required>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>📚 GS Hours</label>
                        <input type="number" id="gsHours" step="0.5" min="0">
                    </div>
                    <div class="form-group">
                        <label>📝 CSAT Hours</label>
                        <input type="number" id="csatHours" step="0.5" min="0">
                    </div>
                </div>
                <button type="submit" class="btn btn-success full-width">💾 Save Entry</button>
            </form>
        </div>
    </div>

    <script>
        // 🔥 SUPABASE CONFIG - YOUR KEYS
        const SUPABASE_URL = "https://gpcbkguyrkluazkznybf.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdwY2JrZ3V5cmtsdWF6a3pueWJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwNzMwMTIsImV4cCI6MjA5MDY0OTAxMn0.NqG6ggDw2xV2mHv1B0HB78c6Td-xMgOCtGTNnpgMatw";
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUser = null;

        // 🔥 DOM ELEMENTS
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const userEmail = document.getElementById('userEmail');
        const dashboard = document.getElementById('dashboard');
        const loginModal = document.getElementById('loginModal');
        const entryModal = document.getElementById('entryModal');
        const authForm = document.getElementById('authForm');
        const entryForm = document.getElementById('entryForm');

        // Auth state listener
        supabase.auth.onAuthStateChange((event, session) => {
            if (session?.user) {
                currentUser = session.user;
                showDashboard();
            } else {
                currentUser = null;
                showLogin();
            }
        });

        // Login form
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                // Try signup
                const { error: signupError } = await supabase.auth.signUp({ email, password });
                if (signupError) {
                    alert(`Error: ${signupError.message}`);
                } else {
                    alert('✅ Account created! Check email & login again.');
                }
            } else {
                loginModal.style.display = 'none';
            }
        });

        // UI Functions
        function showDashboard() {
            loginBtn.style.display = 'none';
            logoutBtn.style.display = 'inline-flex';
            userEmail.style.display = 'inline-flex';
            userEmail.textContent = currentUser.email;
            dashboard.style.display = 'block';
        }

        function showLogin() {
            loginBtn.style.display = 'inline-flex';
            logoutBtn.style.display = 'none';
            userEmail.style.display = 'none';
            dashboard.style.display = 'none';
        }

        // Event listeners
        loginBtn.onclick = () => loginModal.style.display = 'flex';
        logoutBtn.onclick = async () => {
            await supabase.auth.signOut();
            location.reload();
        };

        document.querySelectorAll('.close').forEach(btn => {
            btn.onclick = () => {
                loginModal.style.display = 'none';
                entryModal.style.display = 'none';
            }
        });

        document.getElementById('addEntryBtn').onclick = () => entryModal.style.display = 'flex';
    </script>
</body>
</html>
