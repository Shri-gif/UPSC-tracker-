<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preparation Tracker Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        .tab {
            flex: 1;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            color: #6c757d;
        }

        .tab.active {
            background: white;
            color: #4facfe;
            border-bottom: 3px solid #4facfe;
        }

        .tab-content {
            display: none;
            padding: 30px;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        .btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            border-top: 4px solid #4facfe;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #4facfe;
            margin-bottom: 10px;
        }

        .stat-label {
            color: #6c757d;
            font-size: 1.1em;
        }

        .records-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .record-item {
            background: #f8f9fa;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            border-left: 5px solid #4facfe;
        }

        .record-date {
            color: #6c757d;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .record-title {
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 5px;
        }

        .record-desc {
            color: #6c757d;
            line-height: 1.5;
        }

        .chart-container {
            position: relative;
            height: 400px;
            margin: 30px 0;
        }

        .period-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .period-btn {
            padding: 10px 20px;
            border: 2px solid #e9ecef;
            background: white;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .period-btn.active {
            background: #4facfe;
            color: white;
            border-color: #4facfe;
        }

        @media (max-width: 768px) {
            .tabs {
                flex-direction: column;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Preparation Tracker Pro</h1>
            <p>Track your weekly, monthly & yearly progress</p>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('add')">➕ Add Record</div>
            <div class="tab" onclick="switchTab('view')">📊 View Records</div>
            <div class="tab" onclick="switchTab('stats')">📈 Analytics</div>
        </div>

        <!-- Add Record Tab -->
        <div id="add" class="tab-content active">
            <form id="prepForm">
                <div class="form-group">
                    <label>📖 Subject/Topic</label>
                    <input type="text" id="subject" required>
                </div>
                <div class="form-group">
                    <label>⏱️ Study Hours</label>
                    <input type="number" id="hours" min="0" step="0.5" required>
                </div>
                <div class="form-group">
                    <label>📝 Description</label>
                    <textarea id="description" rows="4" placeholder="What did you study? Key points?"></textarea>
                </div>
                <div class="form-group">
                    <label>⭐ Difficulty Level</label>
                    <select id="difficulty" required>
                        <option value="">Select Level</option>
                        <option value="easy">😊 Easy</option>
                        <option value="medium">😐 Medium</option>
                        <option value="hard">😤 Hard</option>
                    </select>
                </div>
                <button type="submit" class="btn">💾 Save Record</button>
            </form>
        </div>

        <!-- View Records Tab -->
        <div id="view" class="tab-content">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="totalRecords">0</div>
                    <div class="stat-label">Total Records</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalHours">0</div>
                    <div class="stat-label">Total Hours</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="avgHours">0</div>
                    <div class="stat-label">Avg Daily Hours</div>
                </div>
            </div>
            <div id="recordsList" class="records-list"></div>
        </div>

        <!-- Analytics Tab -->
        <div id="stats" class="tab-content">
            <div class="period-selector">
                <button class="period-btn active" data-period="week">📅 This Week</button>
                <button class="period-btn" data-period="month">📆 This Month</button>
                <button class="period-btn" data-period="year">📅 This Year</button>
                <button class="period-btn" data-period="all">📊 All Time</button>
            </div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="periodTotalHours">0</div>
                    <div class="stat-label" id="periodLabel">Total Hours</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="periodAvgHours">0</div>
                    <div class="stat-label">Avg Daily</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="periodRecords">0</div>
                    <div class="stat-label">Records</div>
                </div>
            </div>

            <div class="chart-container">
                <canvas id="prepChart"></canvas>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
