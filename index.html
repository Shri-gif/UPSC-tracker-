<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPSC Tracker</title>
</head>

<body>

<h1>UPSC Tracker 🔥</h1>

<button onclick="login()">Login with Google</button>
<button onclick="logout()">Logout</button>
<button onclick="addProduct()">Add Product</button>

<div id="products-container"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { 
  getAuth, 
  GoogleAuthProvider, 
  signInWithRedirect,
  getRedirectResult,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "upsc-tracker-f4f30.firebaseapp.com",
  projectId: "upsc-tracker-f4f30",
  storageBucket: "upsc-tracker-f4f30.appspot.com",
  messagingSenderId: "984156387207",
  appId: "1:984156387207:web:480541277bb02f0fc1c522"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();


// 🔥 LOGIN (REDIRECT FIXED)
window.login = async function () {
  await signInWithRedirect(auth, provider);
};


// 🔥 HANDLE REDIRECT RESULT
getRedirectResult(auth)
  .then((result) => {
    if (result && result.user) {
      console.log("Login success:", result.user.uid);
    }
  })
  .catch((error) => {
    console.error("Login error:", error);
  });


// 🔥 LOGOUT
window.logout = async function () {
  await signOut(auth);
};


// 🔥 USER DETECT
onAuthStateChanged(auth, (user) => {
  if (user) {
    console.log("Logged in:", user.uid);
    loadProducts(user.uid);
  } else {
    document.getElementById("products-container").innerHTML = "Login karo 😅";
  }
});


// 🔥 LOAD USER DATA (IMPORTANT FIX)
window.loadProducts = async function (uid) {
  const container = document.getElementById("products-container");
  container.innerHTML = "";

  const q = query(collection(db, "products"), where("uid", "==", uid));
  const snapshot = await getDocs(q);

  snapshot.forEach((doc) => {
    const product = doc.data();

    const div = document.createElement("div");
    div.innerHTML = `
      <div style="border:1px solid #ccc; padding:10px; margin:10px;">
        <h3>${product.name}</h3>
        <p>${product.price}</p>
      </div>
    `;

    container.appendChild(div);
  });
};


// 🔥 ADD PRODUCT (USER-WISE SAVE)
window.addProduct = async function () {
  const user = auth.currentUser;

  if (!user) {
    alert("Login karo pehle ❌");
    return;
  }

  await addDoc(collection(db, "products"), {
    name: "Test Product",
    price: 100,
    uid: user.uid
  });

  loadProducts(user.uid);
};

</script>

</body>
</html>
