<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPSC Tracker - Supabase</title>
    
     <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            max-width: 900px; 
            margin: 0 auto; 
            padding: 20px; 
           background: 
               linear-gradient(135deg, rgba(102,126,234,0.6), rgba(118,75,162,0.6)),
               url("bg.jpg") no-repeat center center/cover;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container { background: white; 
                    border-radius: 20px; 
                    padding: 30px; 
                    box-shadow: 0 20px 40px rgba(0,0,0,0.1); 
                   }
         
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        .auth-container { display: flex; gap: 30px; margin-bottom: 30px; }
        .auth-form { flex: 1; background: #f8f9fa; padding: 25px; border-radius: 15px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input { width: 100%; padding: 12px; border: 2px solid #e1e5e9; border-radius: 10px; font-size: 16px; transition: border-color 0.3s; }
        input:focus { outline: none; border-color: #667eea; }
        button { 
            width: 100%; padding: 14px; background: linear-gradient(45deg, #667eea, #764ba2); 
            color: white; border: none; border-radius: 10px; font-size: 16px; 
            font-weight: 600; cursor: pointer; transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); }
        .dashboard-header { 
            display: flex; justify-content: space-between; align-items: center; 
            background: linear-gradient(45deg, #667eea, #764ba2); 
            color: white; padding: 20px; border-radius: 15px; margin-bottom: 30px;
        }
        .study-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .entries-list { display: grid; gap: 20px; }
        .entry-card { 
            background: #f8f9fa; border-radius: 15px; padding: 25px; 
            border-left: 5px solid #667eea; box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        .entry-date { font-size: 24px; font-weight: bold; color: #333; margin-bottom: 15px; }
        .entry-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .stat { background: white; padding: 12px; border-radius: 10px; text-align: center; font-weight: 600; }
        .entry-actions { display: flex; gap: 10px; }
        .btn-small { padding: 8px 16px; font-size: 14px; border-radius: 8px; cursor: pointer; border: none; }
        .edit-btn { background: #28a745; color: white; }
        .delete-btn { background: #dc3545; color: white; }
        .hidden { display: none !important; }
        .no-entries { text-align: center; color: #666; font-style: italic; padding: 40px; }
        .chart-box {
  width: 100%;
  max-width: 500px;
  margin: 20px auto;
  background: white;
  padding: 15px;
  border-radius: 15px;
}

         canvas {
  width: 100% !important;
  height: 250px !important;
}
           @media (max-width: 768px) {
  .auth-container {
    flex-direction: column;
  }
 
    }
.tab-content {
  display: none;
  width: 100%;
}

#home {
  display: block;
}

/* FIX ALIGNMENT */
#current, #add, #analytics {
  max-width: 600px;
  margin: 0 auto;
}

/* News cards fix */
#news-container div {
  background: #f1f1f1;
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 10px;
}
         #news-container {
  display: flex;
  flex-direction: column;
  gap: 15px;
  width: 100%;
         }
         #news-container div {
  background: #f8f9fa;
  padding: 15px;
  border-radius: 12px;
  color: #333;
         }

/* Form full width */
.study-form {
  display: flex;
  flex-direction: column;
  gap: 15px;
}
         .navbar {
  display: flex;
  justify-content: center;   
  gap: 10px;                 
  flex-wrap: wrap;           
  margin: 20px 0;
}

.navbar button {
  width: auto;             
  padding: 10px 15px;
  border-radius: 10px;
}
.navbar button {
  background: linear-gradient(45deg, #667eea, #764ba2);
  color: white;
  border: none;
         }

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
}

.dashboard {
    max-width: 800px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    padding: 20px;
}

.streak-card, .countdown-card {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 20px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    backdrop-filter: blur(10px);
}

.streak-card h3, .countdown-card h3 {
    color: #333;
    margin-bottom: 20px;
    font-size: 1.4em;
}

.streak-display {
    margin: 20px 0;
}

.streak-number {
    font-size: 4em;
    font-weight: bold;
    background: linear-gradient(45deg, #ff6b6b, #feca57);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    display: block;
}

.streak-label {
    font-size: 1.2em;
    color: #666;
}

.streak-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin: 20px 0;
}

.btn-mark, .btn-reset {
    padding: 12px 24px;
    border: none;
    border-radius: 25px;
    font-size: 1em;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
}

.btn-mark {
    background: linear-gradient(45deg, #4ecdc4, #44a08d);
    color: white;
}

.btn-mark:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(78, 205, 196, 0.4);
}

.btn-reset {
    background: linear-gradient(45deg, #ff9ff3, #f368e0);
    color: white;
}

.btn-reset:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(255, 153, 243, 0.4);
}

.streak-info {
    color: #666;
    font-size: 0.9em;
}

.countdown-display {
    font-size: 2.5em;
    font-weight: bold;
    margin: 20px 0;
    color: #333;
}

.countdown-display span {
    background: linear-gradient(45deg, #a8e6cf, #88d8a3);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 0 5px;
    min-width: 50px;
    display: inline-block;
}

.countdown-date {
    color: #666;
    font-size: 1.1em;
}

/* Mobile Responsive */
@media (max-width: 768px) {
    .dashboard {
        grid-template-columns: 1fr;
        gap: 15px;
        padding: 10px;
    }
    
    .streak-number {
        font-size: 3em;
    }
    
    .countdown-display {
        font-size: 2em;
    }
}
         
    </style>  
    
</head>
<body>

    <nav class="navbar">
  <div class="nav-container">

    <a href="index.html" class="nav-logo">
      <h2>📚 UPSC Tracker</h2>
    </a>

    <div class="nav-buttons">   <!-- 🔥 change class -->
      <button onclick="showTab('home')">Home</button>
      <button onclick="showTab('analytics')">Analytics</button>
      <button onclick="showTab('current')">Current Affairs</button>
      <button onclick="showTab('add')">Add Study</button>
      <button onclick="showTab('daily')">🧠 Daily Analysis</button>
    </div>

  </div>
</nav>
    
    <div class="container">
        <!-- AUTH SECTION -->
        <div id="authSection">
            <h1>🔐 UPSC Tracker Login</h1>
            <p style="margin: 5px 0 20px; font-size: 13px; opacity: 0.7; letter-spacing: 1px; text-align:center;">
             by Srivi 🚀
            </p> 
            <div class="auth-container">
                <div class="auth-form">
                    <h3>📧 Login</h3>
                    <form id="loginForm">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="loginEmail" placeholder="your@email.com" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="loginPassword" placeholder="Password" required>
                        </div>
                        <button type="submit">🚀 Login</button>
                    </form> 
                </div>
                <div class="auth-form">
                    <h3>✨ Sign Up</h3>
                    <form id="signupForm">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="signupEmail" placeholder="your@email.com" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="signupPassword" placeholder="6+ characters" required>
                        </div>
                        <button type="submit">📝 Create Account</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- DASHBOARD SECTION -->
        <div class="dashboard-header">
            <div>
        <a href="index.html">Home</a>
        <h1 style="margin:0;">📚 UPSC Study Tracker</h1>
        <p style="margin: 2px 0 0; font-size: 13px; opacity: 0.8;">
            by Srivi 🚀
        </p>
            </div>
            <div>
        <span id="userEmail" style="margin-right: 15px; font-weight: 600;"></span>     
        <button class="btn-small" onclick="logout()">🚪 Logout</button>
    </div>
        </div>
        
        <div class="dashboard">
        <div class="streak-card">
            <h3>📈 Study Streak</h3>
            <div class="streak-display">
                <span class="streak-number" id="streakCount">0</span>
                <span class="streak-label">days</span>
            </div>
            <div class="streak-actions">
                <button id="markToday" class="btn-mark">✅ Mark Today</button>
                <button id="resetStreak" class="btn-reset">🔄 Reset</button>
            </div>
            <div class="streak-info">
                <span id="lastStudyDate">-</span>
            </div>
        </div>
            
            <!-- Streak & Countdown Section -->

        <div class="countdown-card">
            <h3>⏰ UPSC Prelims 2025</h3>
            <div class="countdown-display" id="countdown">
                <span id="days">00</span>D
                <span id="hours">00</span>H
                <span id="minutes">00</span>M
                <span id="seconds">00</span>S
            </div>
            <div class="countdown-date">
                <strong>May 25, 2025</strong>
            </div>
        </div>
    </div>

        
       <div id="analytics" class="tab-content">
        <h3 style="margin-top:20px;">📊 Analytics</h3>
<div class="chart-box">
    <canvas id="trendChart"></canvas>
</div>
     <h3>📅 Study History</h3>
   <div id="historyList"></div>
       </div>
  <div id="current" class="tab-content">
  <h2>📰 Current Affairs</h2>
  <div id="news-container"></div>
            </div>
  <div id="daily" class="tab-content">
  <h2>🧠 Daily UPSC Analysis</h2>
  <div id="analysis-container"></div>
  <button onclick="processVideo()">🎥 Process YouTube Video</button>
  </div>
            
            <div id="add" class="tab-content">
              <form id="addForm" class="study-form">
                <div class="form-group">
                    <label>📅 Date</label>
                    <input type="date" id="entryDate" required>
                </div>
                <div class="form-group">
                    <label>📖 GS Hours</label>
                    <input type="number" id="gsHours" step="0.5" min="0" placeholder="0">
                </div>
                <div class="form-group">
                    <label>🎯 CSAT Hours</label>
                    <input type="number" id="csatHours" step="0.5" min="0" placeholder="0">
                </div>
                <div class="form-group">
                    <label>📚 Optional</label>
                    <input type="number" id="optionalHours" step="0.5" min="0" placeholder="0">
                </div>
                <div class="form-group">
                    <label>📰 Current Affairs</label>
                    <input type="number" id="currentAffairs" step="0.5" min="0" placeholder="0">
                </div>
                <div class="form-group">
                    <label>🔄 Revision</label>
                    <input type="number" id="revisionHours" step="0.5" min="0" placeholder="0">
                </div>
                <div class="form-group">
                    <label>📝 Mock Test</label>
                    <input type="number" id="mockHours" step="0.5" min="0" placeholder="0">
                </div>
                <button type="submit">➕ Add Study Session</button>
                <button type="button" class="btn-small" onclick="resetForm()" style="width: auto; background: #6c757d;">🔄 Reset</button>
              </form>
            <div id="dataList" class="entries-list">
                <div class="no-entries">Login to see your study sessions! 🎯</div>
            </div>
            </div>
        </div>
    
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
